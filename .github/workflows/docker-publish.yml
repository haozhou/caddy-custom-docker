name: Build and push images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: caddy-custom
            dockerfile: Dockerfile
            version_arg: CADDY_VERSION
          - name: tailscale-nginx-auth
            dockerfile: Tailscale-nginx-auth-dockerfile
            version_arg: TAILSCALE_VERSION
    env:
      # Docker Hub namespace: the repository variable DOCKERHUB_NAMESPACE if set
      # (e.g. an organization), otherwise the DOCKERHUB_USERNAME secret. The
      # 'local' fallback lets PR builds run before the secrets are configured.
      IMAGE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME || 'local' }}/${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7

      - name: Read upstream version from Dockerfile
        id: ver
        run: |
          v=$(grep -m1 "^ARG ${{ matrix.version_arg }}=" "${{ matrix.dockerfile }}" | cut -d= -f2)
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          # Pull requests only check that the image builds.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
